<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="robots" content="noindex" />
  <title>BW 2025 — Home</title>
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/layout.css" />
  <link rel="stylesheet" href="css/components.css" />
  <link rel="icon" href="/favicon.ico" />
</head>
<body class="page-home">
  <header class="site-header" role="banner">
    <div class="header-inner">
      <div class="brand">
        <a href="/" class="brand-link" aria-label="Baltic Way 2025 Home">
          <div class="brand-logo" aria-hidden="true">BW</div>
          <div class="brand-text" data-key="header.brand_text">Baltic Way 2025 — Training</div>
        </a>
      </div>

      <nav class="main-nav" role="navigation" aria-label="Main navigation">
        <button class="mobile-nav-toggle" aria-expanded="false" aria-controls="primary-menu">☰</button>
        <ul id="primary-menu" class="nav-list">
          <li><a href="index.html" data-key="home">Home</a></li>
          <li><a href="materials/" data-key="materials">Materials</a></li>
          <li><a href="tips/" data-key="tips">Tips & Strategies</a></li>
          <li><a href="daily-problems/" data-key="daily_problems">Daily Problems</a></li>
          <li><a href="contact/" data-key="contact">Contact</a></li>
        </ul>
      </nav>

      <div class="header-controls">
        <label for="language-switcher-select" class="language-label" id="language-switcher-label">Language:</label>
        <select id="language-switcher-select" class="language-select" aria-label="Language switcher">
          <option value="en">English</option>
          <option value="est">Eesti</option>
        </select>

        <button id="theme-toggle" class="btn-icon" title="Toggle theme" aria-pressed="false">🌓</button>
      </div>
    </div>
  </header>

  <main class="page-main">
    <section class="hero">
  <div class="hero-inner">
    <h1 id="header-title" data-key="header.hero_title">Baltic Way 2025 Olympiad Training</h1>
    <div class="hero-cta">
      <a class="btn-primary" href="daily-problems/" data-key="home.hero_cta_today">Today's Problem</a>
      <a class="btn-ghost" href="materials/" data-key="home.hero_cta_browse">Browse Materials</a>
    </div>
  </div>
</section>

<section class="upcoming container">
  <div class="section-head">
    <h2 id="home-title" data-key="home.upcoming_events">Upcoming Events</h2>
    <div class="mini-controls">
      <button id="show-past" class="link-btn" data-key="home.show_past">Show past</button>
    </div>
  </div>
      

      <div id="counters-container" class="events-grid" aria-live="polite">
        <!-- JS injects countdown cards here -->
      </div>
    </section>
  </main>

  <footer class="site-footer" role="contentinfo">
    <div class="footer-inner">
      <p id="footer-text">&copy; 2025 star-1ord. All rights reserved.</p>
    </div>
  </footer>

  <script src="js/main.js"></script>
  <script src="js/languages.js"></script>
  <script src="js/home.js"></script>
</body>
</html>
