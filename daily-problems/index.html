<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="robots" content="noindex" />
  <title>BW 2025 — Daily Problems</title>
    
  <!-- include common styles -->
  <link rel="stylesheet" href="../css/base.css" />
  <link rel="stylesheet" href="../css/layout.css" />
  <link rel="stylesheet" href="../css/components.css" />
  <link rel="stylesheet" href="../css/daily-problems.css" />
  <link rel="icon" href="../favicon.ico" />

  <!-- MathJax Configuration -->
    <script>
        window.MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\(', '\)'],['\\(', '\\)']],
                displayMath: [['$$', '$$'], ['\[', '\]'],['\\[', '\\]']]
            },
            chtml: {
                scale: 1,
                minScaleAdjust: 100,
                mtextInheritFont: true,
            }
        };
    </script>
  <!-- MathJax Script -->
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js"></script>
    
    <!-- Supabase JavaScript Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/luxon/3.3.0/luxon.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/seedrandom/3.0.5/seedrandom.min.js"></script>
</head>
<body class="page-daily">
  <header class="site-header">
    <div class="header-inner">
      <div class="brand"><a href="/" class="brand-link"><div class="brand-logo">BW</div><div class="brand-text">Baltic Way 2025</div></a></div>
      <nav class="main-nav"><button class="mobile-nav-toggle" aria-expanded="false" aria-controls="primary-menu">☰</button>
        <ul id="primary-menu" class="nav-list">
          <li><a href="../index.html" data-key="home">Home</a></li>
          <li><a href="../materials/" data-key="materials">Materials</a></li>
          <li><a href="../tips/" data-key="tips">Tips & Strategies</a></li>
          <li><a href="../daily-problems/" data-key="daily_problems">Daily Problems</a></li>
          <li><a href="../contact/" data-key="contact">Contact</a></li>
        </ul>
      </nav>
      <div class="header-controls">
        <label id="language-switcher-label" for="language-switcher-select">Language:</label>
        <select id="language-switcher-select">
          <option value="en">English</option>
          <option value="est">Eesti</option>
        </select>
        <button id="theme-toggle" class="btn-icon">🌓</button>
      </div>
    </div>
  </header>

  <main class="container daily-problems">
    <h2 id="daily-problems-title" data-key="daily_problems.title">Daily Problems</h2>
    <div id="current-date" class="date-display" aria-live="polite"></div>

    <div class="topics-selector" role="tablist" aria-label="Problem topics">
      <button class="topic-btn active" data-topic="A" role="tab" aria-selected="true">A</button>
      <button class="topic-btn" data-topic="N" role="tab">N</button>
      <button class="topic-btn" data-topic="C" role="tab">C</button>
      <button class="topic-btn" data-topic="G" role="tab">G</button>
    </div>

    <!-- Daily Problem Card -->
    <div class="problem-card accent-top" role="region" aria-labelledby="daily-problems-title">
      <div class="problem-body">
        <div class="topic-indicator" id="topic-indicator">A</div>

        <div style="flex:1" class="left-accent">
          <div class="problem-meta" id="problem-name">2022/3</div>
          <div id="problem-statement" class="problem-statement" tabindex="0">
            <!-- injected statement -->
          </div>

          <button class="open-new-btn" id="daily-open-btn" data-key="daily_problems.open_in_new_tab">Open in new tab</button>
        </div>
      </div>
    </div>

    <div class="random-trigger">
      <button class="random-btn" data-topic="A" data-key="daily_problems.random_button">Get a random problem</button>
    </div>

    <!-- FIX ISSUE 3: Random problem card now in HTML for i18n support -->
    <div id="random-problem-display" class="random-problem-display" style="display:none;">
      <div class="problem-card accent-top">
        <div class="problem-body">
          <div class="topic-indicator" id="random-topic-indicator">N</div>

          <div style="flex:1" class="left-accent">
            <div class="problem-meta" id="random-problem-name">2020/19</div>
            <div id="random-problem-statement" class="problem-statement">
              <!-- injected random statement -->
            </div>

            <button class="open-new-btn" id="random-open-btn" data-key="daily_problems.open_in_new_tab">Open in new tab</button>
          </div>
        </div>
      </div>
    </div>

    <div class="track-progress">
      <a href="https://shorturl.at/3UPy4" target="_blank" rel="noopener noreferrer" data-key="daily_problems.track_progress">Track your progress here</a>
    </div>
  </main>

  <footer class="site-footer"><div class="footer-inner"><p>&copy; 2025 star-1ord. All rights reserved.</p></div></footer>

  <!-- scripts: languages.js must be before page logic -->
  <script src="../js/main.js"></script>
  <script src="../js/languages.js"></script>
  <script src="../js/daily-problems.js"></script>
</body>
</html>
